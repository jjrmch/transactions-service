spring.application.name=transactions-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transacciones}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Evitar el 503 "No servers available" justo tras el arranque:
# - refrescar el registro de Eureka rápido
# - no cachear listas vacías de instancias en el LoadBalancer (cache negativo)
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.enabled=false